# Publishes the crate to crates.io when a version tag (e.g. v0.1.2) is pushed.
# Authentication uses crates.io Trusted Publishing (OIDC), so no long-lived
# API token is stored in the repository.

name: Release

on:
  push:
    tags: [ "v*" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "doc-assert") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version v$version"
            exit 1
          fi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy -- -D warnings
      - name: Build
        run: cargo build --verbose --features="binary"
      - name: Run tests
        run: cargo test --verbose --workspace
      - name: Start sample-api backend
        working-directory: ./tests/functional
        run: make backend-start
      - name: Wait for sample-api backend
        working-directory: ./tests/functional
        run: make backend-wait
      - name: Run sanity functional tests
        working-directory: ./tests/functional
        run: make sanity
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
